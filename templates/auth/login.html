<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Smart Reminder System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Dark Glassmorphism CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-wrapper">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <span class="p-3 rounded-circle d-inline-block shadow-lg" style="background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);">
                                <i class="fa-solid fa-bell-concierge fa-2x text-white"></i>
                            </span>
                        </div>
                        <h3 class="fw-bold text-white mb-1" style="letter-spacing: -0.02em;">Smart Reminder System</h3>
                        <p class="text-slate-400 small">Sign in to your role dashboard</p>
                    </div>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category if category != 'danger' else 'danger' }} alert-dismissible fade show text-white py-2.5 px-3 small rounded-3 mb-3 border-0" role="alert" style="background: rgba(225, 29, 72, 0.25); border: 1px solid rgba(225, 29, 72, 0.4);">
                                    <i class="fa-solid fa-circle-exclamation me-1 text-rose-400"></i> {{ message }}
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form action="{{ url_for('auth.login') }}" method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="name@univ.edu" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                                <button type="button" class="btn btn-outline-secondary border-start-0 input-group-text" id="togglePasswordBtn" style="background: rgba(30, 41, 59, 0.8) !important;">
                                    <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-glass-primary w-100 py-3 fw-semibold shadow-lg">
                            <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
                        </button>
                    </form>

                    <!-- Quick Demo Credentials Chips -->
                    <div class="mt-4 pt-3 border-top border-white border-opacity-10 text-center">
                        <p class="text-slate-400 small mb-2"><i class="fa-solid fa-key me-1 text-indigo"></i> Quick Demo Login:</p>
                        <div class="d-flex justify-content-center gap-2 flex-wrap">
                            <button type="button" class="btn btn-glass-secondary btn-sm" onclick="fillDemo('admin@system.com', 'admin123')">
                                Admin
                            </button>
                            <button type="button" class="btn btn-glass-secondary btn-sm" onclick="fillDemo('prof.smith@univ.edu', 'faculty123')">
                                Faculty
                            </button>
                            <button type="button" class="btn btn-glass-secondary btn-sm" onclick="fillDemo('student.john@univ.edu', 'student123')">
                                Student
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function fillDemo(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
        }

        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('togglePasswordIcon');

        if (toggleBtn && passwordInput && toggleIcon) {
            toggleBtn.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleIcon.classList.toggle('fa-eye');
                toggleIcon.classList.toggle('fa-eye-slash');
            });
        }
    </script>
</body>
</html>
