<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Smart Reminder System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-wrapper">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <span class="p-3 rounded-circle bg-indigo text-white d-inline-block shadow-lg" style="background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);">
                                <i class="fa-solid fa-bell-concierge fa-2x"></i>
                            </span>
                        </div>
                        <h3 class="fw-bold text-white mb-1">Smart Reminder System</h3>
                        <p class="text-slate-400 small">Sign in to your role dashboard</p>
                    </div>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} alert-dismissible fade show text-dark py-2 px-3 small rounded-3 mb-3" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form action="{{ url_for('auth.login') }}" method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-slate-400"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="name@univ.edu" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-slate-400"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold rounded-3 shadow-lg" style="background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); border: none;">
                            <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
                        </button>
                    </form>

                    <!-- Quick Demo Credentials for Evaluation -->
                    <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center">
                        <p class="text-slate-400 small mb-2"><i class="fa-solid fa-key me-1"></i> Quick Test Credentials:</p>
                        <div class="d-flex justify-content-center gap-2 flex-wrap">
                            <button type="button" class="btn btn-outline-light btn-sm opacity-75" onclick="fillDemo('admin@system.com', 'admin123')">
                                Admin
                            </button>
                            <button type="button" class="btn btn-outline-light btn-sm opacity-75" onclick="fillDemo('prof.smith@univ.edu', 'faculty123')">
                                Faculty
                            </button>
                            <button type="button" class="btn btn-outline-light btn-sm opacity-75" onclick="fillDemo('student.john@univ.edu', 'student123')">
                                Student
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function fillDemo(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
        }
    </script>
</body>
</html>
