{% extends 'base.html' %}

{% block title %}User Profile - Student Smart Reminder System{% endblock %}
{% block header_title %}User Profile Settings{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="glass-card p-4 p-md-5 mb-4">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="rounded-circle text-white d-flex align-items-center justify-content-center shadow-lg" style="width: 64px; height: 64px; font-size: 1.75rem; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <h4 class="fw-bold mb-0 text-white">{{ user.full_name }}</h4>
                    <span class="badge text-uppercase text-white px-3 py-1 mt-1" style="background: #6366f1;">{{ user.role }}</span>
                </div>
            </div>

            <form action="{{ url_for('auth.profile') }}" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Email Address (Read-only)</label>
                        <input type="email" class="form-control opacity-75" value="{{ user.email }}" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Role</label>
                        <input type="text" class="form-control text-capitalize opacity-75" value="{{ user.role }}" readonly>
                    </div>

                    <div class="col-md-6">
                        <label for="full_name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" value="{{ user.full_name }}" required>
                    </div>

                    <div class="col-md-6">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phone" name="phone" value="{{ user.phone or '' }}" placeholder="+1-555-0199">
                    </div>

                    <div class="col-12 mt-4 pt-3 border-top border-white border-opacity-10">
                        <h6 class="fw-bold text-white mb-3"><i class="fa-solid fa-key me-2 text-warning"></i>Change Password</h6>
                        <div class="col-md-6">
                            <label for="new_password" class="form-label">New Password (Leave blank to keep current)</label>
                            <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Enter new password">
                        </div>
                    </div>
                </div>

                <div class="mt-4 pt-3 d-flex justify-content-end">
                    <button type="submit" class="btn btn-glass-primary px-4 py-2">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
